name: Build Assistant APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: 'platform-tools;34.0.0 platforms;android-34 build-tools;34.0.0'

      - name: Install NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "ndk;29.0.14206865" >/dev/null 2>&1 || true
          if [ ! -d "$SDK/ndk/29.0.14206865" ]; then
            echo "NDK 29.0.14206865 was not installed" >&2
            ls "$SDK/ndk" || true
            exit 1
          fi

      - name: Build nonRoot debug APK
        run: ./gradlew assembleNonRootDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-assistant-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
