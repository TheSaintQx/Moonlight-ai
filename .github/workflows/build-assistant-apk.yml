name: Build Assistant APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ensure moonlight-common-c submodule content
        run: |
          SUBMOD_DIR="app/src/main/jni/moonlight-core/moonlight-common-c"
          if [ ! -d "$SUBMOD_DIR/src" ]; then
            echo "Submodule empty, cloning directly..."
            rm -rf "$SUBMOD_DIR"
            git clone --recursive https://github.com/moonlight-stream/moonlight-common-c.git "$SUBMOD_DIR"
          else
            echo "Submodule already populated"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true

      - name: Install NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          fi
          "$SM" --install "ndk;29.0.14206865" >/dev/null 2>&1 || true
          if [ ! -d "$SDK/ndk/29.0.14206865" ]; then
            echo "NDK not installed, trying latest..." >&2
            "$SM" --install "ndk" >/dev/null 2>&1 || true
          fi
          ls "$SDK/ndk" || true

      - name: Build nonRoot debug APK
        run: ./gradlew assembleNonRootDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-assistant-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
